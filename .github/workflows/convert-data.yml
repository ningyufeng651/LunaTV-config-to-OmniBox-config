name: 自动转换站点数据

on:
  workflow_dispatch:
  # schedule:
    # - cron: '0 0/6 * * *'

jobs:
  convert-and-commit:
    runs-on: ubuntu-latest
    # =========关键：赋予token写仓库权限=========
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # 优先使用内置GITHUB_TOKEN，permissions已经授权写权限
          # 若后续还报错，就取消注释使用自己的PAT
          # token: ${{ secrets.MY_PAT }}

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: 拉取并转换数据
        run: |
          echo "开始拉取并转换数据..."
          # 如果是同一个仓库，直接读取本地文件，不要curl raw（私有仓库curl会404）
          python3 convert_data.py < LunaTV-config.json > converted_data.json

          echo "转换完成！统计信息："
          python3 -c "
          import json
          with open('converted_data.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          adult = len([s for s in data['sites'] if s['tags'] == ['成人']])
          excellent = len([s for s in data['sites'] if s['tags'] == ['优秀']])
          print(f'总站点数: {len(data[\"sites\"])}')
          print(f'成人站点: {adult}个')
          print(f'优秀站点: {excellent}个')
          "

      - name: 提交更新
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add converted_data.json

          if git diff --cached --quiet; then
            echo "数据无变化，无需提交。"
          else
            TIMESTAMP=$(date +'%Y-%m-%d %H:%M:%S')
            TOTAL_COUNT=$(python3 -c "
            import json
            with open('converted_data.json', 'r', encoding='utf-8') as f:
                data = json.load(f)
            total = len(data['sites'])
            print(f'(共{total}个站点)')
            " 2>/dev/null || echo "")

            git commit -m "自动更新：转换站点数据 $TOTAL_COUNT [$TIMESTAMP]"
            git push origin HEAD:main
            echo "提交成功！"
          fi
